<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeAgent - Zero Key Web Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="agent-container">
        <div class="header">
            <h2>NodeAgent</h2>
            <span class="badge">Live Web Active</span>
        </div>
        <div class="chat-box" id="chatBox">
            <p class="bot-msg">System initialized. I am <strong>NodeAgent</strong>. Send me a prompt, and I'll search the live internet and extract answers for you entirely key-free.</p>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask NodeAgent to look up something...">
            <button onclick="runNodeAgent()">Send</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
